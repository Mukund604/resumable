[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumable"
version = "0.1.0"
description = "Durable execution for AI agents: crash at any step, resume without repeating side effects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["resumable"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
